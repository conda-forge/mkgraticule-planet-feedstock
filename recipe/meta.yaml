{% set version = "1.4.0" %}

package:
  name: mkgraticule-planet
  version: {{ version }}

source:
  url: https://github.com/ryodohemmi/mkgraticule_planet/archive/refs/tags/v{{ version }}.tar.gz
  sha256: c1348a6afe98ef43153b4588d62a704ab9b078536e579d2759d23fd9ed8c1df5

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - mkgraticule = mkgraticule_planet.cli:main
    - mkgraticule_planet = mkgraticule_planet.cli:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=68.0
  run:
    - python >={{ python_min }}
    - numpy
    - gdal
    - trimesh
    - rtree

test:
  requires:
    - python {{ python_min }}
  imports:
    - mkgraticule_planet
  commands:
    - mkgraticule --help
    - mkgraticule_planet --version
    - mkgraticule_planet --help

about:
  home: https://github.com/ryodohemmi/mkgraticule_planet
  summary: Create planetary-scale graticules with multi-format labels for any GDAL/PROJ-supported CRS — exported as GeoPackage, SpatiaLite, or fitted 3D PLY
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ryodohemmi
